            font-weight: bold;

        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto 40px auto;
            align-items: center;

                grid-template-columns: 1fr auto 1fr;

        /* Columnas de Menú */

            display: flex;
            flex-direction: column;
            gap: 15px;

            display: inline-block;

        .blink-effect {
            animation: modern-blink 2s infinite;
        }
        @keyframes modern-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Imagen Central (Loba) */
        .center-image-box {
            text-align: center;
        }
        .center-image-box img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        /* --- SECCIÓN INFERIOR (IMPERIO, HISPANIA, ITALIA) --- */
        .bottom-nav {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto 40px auto;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 20px 0;

        @media (min-width: 600px) {
